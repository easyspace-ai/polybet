version: 2

project_name: polybet

builds:
  - id: polybet
    main: ./cmd/server
    dir: server
    binary: polybet
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # One artifact per OS×arch: e.g. polybet_darwin_arm64.tar.gz,
  # polybet_windows_amd64.zip (binary inside is `polybet` / `polybet.exe`).
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
