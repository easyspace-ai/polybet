name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag name
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: cd server && go test ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Desktop artifacts and attach to the same GitHub Release.
  #
  # Each matrix job uploads its native installers plus the update metadata
  # file that job produced under `apps/desktop/dist/`, so electron-updater can
  # resolve `latest.yml` (Windows x64) and `latest-mac.yml` (macOS arm64)
  # without either job overwriting the other's primary metadata:
  #   - Windows: `latest.yml` + NSIS `.exe` + portable `.zip`
  #   - macOS:   `latest-mac.yml` + `.dmg` + `.zip` (zip is first in
  #     `electron-builder.yml` so `latest-mac.yml` prefers the zip URL)
  #
  # Unsigned builds by default; enable signing/notarization via CSC_* / APPLE_*.
  #
  # Desktop build order (must stay in this sequence):
  #   1. pnpm install — workspace deps for dashboard + desktop scripts
  #   2. make dashboard-embed — `pnpm --filter dashboard build`, copy dist →
  #      server/internal/webui/dashboard-dist (compiled into Go via go:embed)
  #   3. node scripts/package.mjs — bundle-cli (cross-compile polybet into
  #      resources) + electron-vite + electron-builder (see Makefile desktop-*)
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Embed operator dashboard into Go webui
        shell: bash
        run: make dashboard-embed

      - name: Package Desktop (${{ matrix.target }} ${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          POLYBET_ALLOW_GENERATED_DIRTY: "true"
        run: node scripts/package.mjs --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload desktop artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="apps/desktop/dist"
          if [[ "${{ matrix.target }}" == "mac" ]]; then
            meta=("$dist/latest-mac.yml")
            dmgs=("$dist"/polybet-desktop-*-mac-arm64.dmg)
            zips=("$dist"/polybet-desktop-*-mac-arm64.zip)
            if [[ "${#meta[@]}" -ne 1 || ! -f "${meta[0]}" ]]; then
              echo "::error::Expected exactly one $dist/latest-mac.yml"
              ls -la "$dist" || true
              exit 1
            fi
            if [[ "${#dmgs[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one mac arm64 DMG, got ${#dmgs[@]}: ${dmgs[*]}"
              ls -la "$dist" || true
              exit 1
            fi
            if [[ "${#zips[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one mac arm64 zip, got ${#zips[@]}: ${zips[*]}"
              ls -la "$dist" || true
              exit 1
            fi
            echo "Uploading (mac): ${meta[0]} ${dmgs[0]} ${zips[0]}"
            gh release upload "${GITHUB_REF_NAME}" "${meta[0]}" "${dmgs[0]}" "${zips[0]}" --clobber
          else
            meta=("$dist/latest.yml")
            exes=("$dist"/polybet-desktop-*-windows-x64.exe)
            zips=("$dist"/polybet-desktop-*-windows-x64.zip)
            if [[ "${#meta[@]}" -ne 1 || ! -f "${meta[0]}" ]]; then
              echo "::error::Expected exactly one $dist/latest.yml"
              ls -la "$dist" || true
              exit 1
            fi
            if [[ "${#exes[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one Windows x64 NSIS exe, got ${#exes[@]}: ${exes[*]}"
              ls -la "$dist" || true
              exit 1
            fi
            if [[ "${#zips[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one Windows x64 zip, got ${#zips[@]}: ${zips[*]}"
              ls -la "$dist" || true
              exit 1
            fi
            echo "Uploading (win): ${meta[0]} ${exes[0]} ${zips[0]}"
            gh release upload "${GITHUB_REF_NAME}" "${meta[0]}" "${exes[0]}" "${zips[0]}" --clobber
          fi
