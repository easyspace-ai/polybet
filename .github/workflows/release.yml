name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag name
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: cd server && go test ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Desktop installers and attach to the same GitHub Release.
  #
  # Release assets are intentionally limited to:
  #   - polybet-desktop-*-mac-arm64.dmg (Apple Silicon only; no Intel mac zip/dmg)
  #   - polybet-desktop-*-windows-x64.exe (NSIS; no Windows arm64 / portable)
  # Linux and other formats are dropped from CI to keep the release page small.
  #
  # We use `electron-builder --publish never` and upload only those two files via
  # `gh release upload` so blockmaps and latest-*.yml are not attached. Tradeoff:
  # electron-updater cannot use this GitHub Release for update discovery unless
  # you add those metadata files again or host updates elsewhere.
  #
  # Unsigned builds by default; code signing can be added via CSC_LINK, APPLE_ID, etc.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Embed operator dashboard into Go webui
        shell: bash
        run: make dashboard-embed

      - name: Package Desktop (${{ matrix.target }} ${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          POLYBET_ALLOW_GENERATED_DIRTY: "true"
        run: node scripts/package.mjs --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload desktop installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ "${{ matrix.target }}" == "mac" ]]; then
            files=(apps/desktop/dist/polybet-desktop-*-mac-arm64.dmg)
          else
            files=(apps/desktop/dist/polybet-desktop-*-windows-x64.exe)
          fi
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one installer for ${{ matrix.target }} ${{ matrix.arch }}, got ${#files[@]}: ${files[*]}"
            ls -la apps/desktop/dist || true
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[0]}" --clobber
