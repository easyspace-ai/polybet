name: Desktop Smoke Build

on:
  workflow_dispatch:

permissions:
  contents: read

# Mirrors release desktop targets: mac arm64 (dmg + zip) and Windows x64
# (NSIS + zip). No Linux job — see `.github/workflows/release.yml`.
#
# Same build order as release.yml desktop job: pnpm install → make
# dashboard-embed (dashboard Vite build + copy into Go embed dir) →
# apps/desktop node scripts/package.mjs.
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress

      - name: Embed operator dashboard into Go webui
        shell: bash
        run: make dashboard-embed

      - name: Package Desktop (${{ matrix.target }} ${{ matrix.arch }})
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          POLYBET_ALLOW_GENERATED_DIRTY: "true"
        run: node scripts/package.mjs --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload Desktop artifacts (mac arm64)
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/polybet-desktop-*-mac-arm64.dmg
            apps/desktop/dist/polybet-desktop-*-mac-arm64.zip
          if-no-files-found: error

      - name: Upload Desktop artifacts (win x64)
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/polybet-desktop-*-windows-x64.exe
            apps/desktop/dist/polybet-desktop-*-windows-x64.zip
          if-no-files-found: error
