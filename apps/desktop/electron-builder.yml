appId: ai.polybet.desktop
productName: polybet
electronVersion: 39.2.6
directories:
  buildResources: build
files:
  # Never pack prior electron-builder output (e.g. dist/win-x64/win-unpacked).
  # Sequential win x64 + arm64 would otherwise nest the first build into the second (~multi‑GB, 7za E_FAIL).
  - "!dist/**/*"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
protocols:
  - name: polybet
    schemes:
      - polybet
asarUnpack:
  - resources/**
  - node_modules/which
  - node_modules/isexe
  - node_modules/cross-spawn
extraResources:
  - from: resources/sounds
    to: sounds
    filter:
      - "**/*.mp3"
# CI release assets are Apple Silicon DMG + Windows x64 NSIS only (see
# `.github/workflows/release.yml`). Linux and Intel mac installers are not
# shipped from GitHub Actions; the linux block remains for optional local
# `pnpm package -- --linux` builds.
mac:
  # Disable signing for local dev builds - set CSC_IDENTITY_AUTO_DISCOVERY
  # or CODE_SIGNING_KEYCHAIN in CI to enable
  sign: false
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
  # Hardcoded name avoids the `@polybet/desktop-*` subdirectory that
  # `${name}` produces for scoped package names.
  # Naming scheme: polybet-desktop-<version>-<platform>-<arch>.<ext>
  # so the filename alone surfaces kind, version, platform, and CPU arch.
  artifactName: polybet-desktop-${version}-mac-${arch}.${ext}
  # Notarize via notarytool. Requires APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  # + APPLE_TEAM_ID env vars at package time. Non-mac contributors are
  # unaffected because `pnpm package` already requires the Developer ID
  # signing cert — notarization is a strict superset.
  notarize: true
dmg:
  artifactName: polybet-desktop-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
  artifactName: polybet-desktop-${version}-linux-${arch}.${ext}
rpm:
  # Disable RPM build-id symlinks. Electron apps embed the upstream Electron
  # binary, whose GNU build-id is identical across every app shipping the same
  # Electron version (Slack, VS Code, Discord, ...). Without this, our RPM
  # would own /usr/lib/.build-id/<hash> paths and collide with any other
  # Electron RPM already installed, breaking `dnf install` on Fedora/RHEL.
  fpm:
    - "--rpm-rpmbuild-define=_build_id_links none"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: polybet-desktop-${version}-windows-${arch}.${ext}
publish:
  provider: github
  owner: easyspace-ai
  repo: polybet
  # Align with our CLI release flow which pre-creates a *published* GitHub
  # Release via `gh release create`. The electron-builder default of
  # `releaseType: draft` conflicts with `existingType=release` and causes
  # uploads of the DMG/blockmaps/latest-mac.yml to be silently skipped,
  # which breaks electron-updater auto-update on installed clients.
  releaseType: release
