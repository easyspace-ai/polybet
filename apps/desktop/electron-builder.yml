appId: ai.polybet.desktop
productName: polybet
electronVersion: 39.2.6
directories:
  buildResources: build
files:
  # Never pack prior electron-builder output (e.g. dist/win-x64/win-unpacked).
  # Sequential win x64 + arm64 would otherwise nest the first build into the second (~multi‑GB, 7za E_FAIL).
  - "!dist/**/*"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
protocols:
  - name: polybet
    schemes:
      - polybet
asarUnpack:
  - resources/**
  - node_modules/which
  - node_modules/isexe
  - node_modules/cross-spawn
extraResources:
  - from: resources/sounds
    to: sounds
    filter:
      - "**/*.mp3"
# CI ships mac arm64 + x64 (zip + dmg) and Windows x64 (NSIS + zip). Linux
# installers are intentionally omitted — use `pnpm package -- --linux` only to
# get a clear “unsupported” error from `scripts/package.mjs`.
mac:
  # Disable signing for local dev builds - set CSC_IDENTITY_AUTO_DISCOVERY
  # or CODE_SIGNING_KEYCHAIN in CI to enable
  sign: false
  # Notarization requires signed builds; keep off for unsigned CI/local builds.
  notarize: false
  entitlementsInherit: build/entitlements.mac.plist
  # Zip is listed first so `latest-mac.yml` (electron-updater) prefers the .zip
  # download path — better for unsigned / manual extract flows. DMG remains for
  # first-time installs from the release page.
  # Both arm64 (Apple Silicon) and x64 (Intel) are built via separate CI matrix
  # entries (macos-14 and macos-13 respectively).
  target:
    - target: zip
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
        - x64
  # Hardcoded name avoids the `@polybet/desktop-*` subdirectory that
  # `${name}` produces for scoped package names.
  # Naming scheme: polybet-desktop-<version>-<platform>-<arch>.<ext>
  # so the filename alone surfaces kind, version, platform, and CPU arch.
  artifactName: polybet-desktop-${version}-mac-${arch}.${ext}
dmg:
  artifactName: polybet-desktop-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: polybet-desktop-${version}-windows-${arch}.${ext}
publish:
  provider: github
  owner: easyspace-ai
  repo: polybet
  # Align with our CLI release flow which pre-creates a *published* GitHub
  # Release via `gh release create`. The electron-builder default of
  # `releaseType: draft` conflicts with `existingType=release` and causes
  # uploads of installers / latest-*.yml to be silently skipped, which breaks
  # electron-updater auto-update on installed clients.
  releaseType: release
